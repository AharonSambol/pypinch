[package]
name = "pinch"
version = "1.0.34"
edition = "2021"
authors = ["Aharon Sambol <aharon.sambol@gmail.com>"]


[lib]
name = "_pypinch"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies.pyo3-ffi]
version = "0.28.0"
features = ["extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
rustc-hash = "2.1.3"
num-bigint = "0.5.1"
ryu = "1.0.23"
itoa = "1.0.18"
seq-macro = "0.3.6"

[build-dependencies]
pyo3-build-config = "0.28.3"